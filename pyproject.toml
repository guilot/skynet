[project]
name = "scanner-volumen"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "websockets>=13",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integracion: banco de pruebas contra la cuenta de simulacion (demo) de Bitget; requiere claves reales, se salta si faltan, ejecutar con -m integracion",
]

[tool.setuptools.packages.find]
include = ["scanner_volumen*"]
